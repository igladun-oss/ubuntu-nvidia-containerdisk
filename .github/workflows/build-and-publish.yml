name: Build And Publish ContainerDisk

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs-only pushes to main should not re-publish the image. Path filters are
    # not evaluated for pushes of tags, so `v*` releases still always build.
    paths:
      - "Dockerfile"
      - "cloud-init/**"
      - "scripts/**"
      - ".github/workflows/build-and-publish.yml"
  workflow_dispatch:
    inputs:
      force_bake:
        description: "Force a fresh QEMU bake even on a cache hit"
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly rescan so the published image is re-checked against new CVEs.
    # On a cache hit the last-baked qcow2 is scanned; an upstream respin
    # (cache miss) triggers a fresh bake as usual.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Free disk space
        run: |
          df -h || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          df -h || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: prep
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ubuntu-nvidia-containerdisk" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream Ubuntu image serial
        id: serial
        run: |
          set -euo pipefail
          sums="$(curl -fsSL https://cloud-images.ubuntu.com/noble/current/SHA256SUMS)"
          serial="$(printf '%s\n' "$sums" | awk '/noble-server-cloudimg-amd64\.img$/ {print $1; exit}')"
          if [ -z "$serial" ]; then
            echo "Could not resolve upstream amd64 image checksum" >&2
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "Upstream noble amd64 serial (sha256): $serial"

      - name: Restore baked golden qcow2 from cache
        id: cache_bake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ubuntu-noble-golden.qcow2
          key: bake-${{ hashFiles('scripts/bake-image.sh', 'cloud-init/**') }}-${{ steps.serial.outputs.serial }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.prep.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Install bake dependencies
        if: steps.cache_bake.outputs.cache-hit != 'true' || github.event.inputs.force_bake == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            genisoimage \
            ovmf \
            qemu-system-x86 \
            qemu-utils

      - name: Cache upstream Ubuntu base image
        if: steps.cache_bake.outputs.cache-hit != 'true' || github.event.inputs.force_bake == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ubuntu-noble-base.qcow2
          key: noble-base-${{ steps.serial.outputs.serial }}

      - name: Bake golden qcow2 (KVM-accelerated)
        if: steps.cache_bake.outputs.cache-hit != 'true' || github.event.inputs.force_bake == 'true'
        env:
          BASE_IMG_SHA256: ${{ steps.serial.outputs.serial }}
        run: ./scripts/bake-image.sh

      - name: Save baked golden qcow2 to cache
        if: steps.cache_bake.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/ubuntu-noble-golden.qcow2
          key: bake-${{ hashFiles('scripts/bake-image.sh', 'cloud-init/**') }}-${{ steps.serial.outputs.serial }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push containerDisk image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Prepare raw disk image for scanning
        run: |
          # Trivy's qcow2 disk driver misreads sector 0 ("Invalid master boot
          # record signature") regardless of compression, so convert to a raw
          # disk image (sparse) whose sector 0 is the real GPT protective MBR.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils
          qemu-img convert -O raw out/ubuntu-noble-golden.qcow2 out/ubuntu-noble-scan.raw
          ls -lh out/ubuntu-noble-scan.raw
          df -h .

      - name: Generate SBOM (CycloneDX) from baked qcow2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: vm
          scan-ref: out/ubuntu-noble-scan.raw
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
          list-all-pkgs: "true"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attest SBOM against the pushed image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## containerDisk build"
            echo ""
            if [ "${{ steps.cache_bake.outputs.cache-hit }}" = "true" ] && [ "${{ github.event.inputs.force_bake }}" != "true" ]; then
              echo "- **Bake cache:** hit (QEMU bake skipped)"
            else
              echo "- **Bake cache:** miss (fresh QEMU bake)"
            fi
            if [ -f out/ubuntu-noble-golden.qcow2 ]; then
              echo "- **Golden qcow2 size:** $(du -h out/ubuntu-noble-golden.qcow2 | cut -f1)"
            fi
            echo "- **Image digest:** ${{ steps.build.outputs.digest }}"
            echo ""
            echo "### Pushed tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

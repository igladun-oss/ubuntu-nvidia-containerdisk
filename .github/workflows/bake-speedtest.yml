name: Bake Speed Test

# Manual-only: bakes the golden qcow2 on a chosen runner and reports wall-clock time.
# Used to compare the default GitHub-hosted runner against the Blacksmith runner.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to bake on"
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  bake-speedtest:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          df -h || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          df -h || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report runner specs
        run: |
          echo "Runner label: ${{ inputs.runner }}"
          echo "vCPUs: $(nproc)"
          free -h || true
          df -h / || true
          if [ -w /dev/kvm ]; then echo "KVM: AVAILABLE (writable /dev/kvm) -> hardware accel"; else echo "KVM: NOT available -> slow TCG emulation"; fi

      - name: Resolve upstream Ubuntu image serial
        id: serial
        run: |
          set -euo pipefail
          sums="$(curl -fsSL https://cloud-images.ubuntu.com/noble/current/SHA256SUMS)"
          serial="$(printf '%s\n' "$sums" | awk '/noble-server-cloudimg-amd64\.img$/ {print $1; exit}')"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"

      - name: Install bake dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            genisoimage \
            ovmf \
            qemu-system-x86 \
            qemu-utils

      - name: Bake golden qcow2 (timed)
        env:
          BASE_IMG_SHA256: ${{ steps.serial.outputs.serial }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./scripts/bake-image.sh
          end=$(date +%s)
          dur=$((end - start))
          {
            echo "## Bake speed test"
            echo ""
            echo "- **Runner:** \`${{ inputs.runner }}\`"
            echo "- **vCPUs:** $(nproc)"
            echo "- **KVM:** $([ -w /dev/kvm ] && echo 'yes (hardware accel)' || echo 'no (TCG emulation)')"
            echo "- **Bake wall-clock:** ${dur}s (~$((dur / 60))m $((dur % 60))s)"
            if [ -f out/ubuntu-noble-golden.qcow2 ]; then
              echo "- **Golden qcow2 size:** $(du -h out/ubuntu-noble-golden.qcow2 | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BAKE_SECONDS=${dur}"
